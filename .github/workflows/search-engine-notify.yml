name: Search engine notify

on:
  workflow_dispatch:
  push:
    paths:
      - "src/content/news/**"
      - "src/app/sitemap.ts"
      - "src/app/**/news/**"
      - "src/data/catalog.normalized.json"
      - "src/data/packagingCategories.ts"
      - "public/**"

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Notify supported search engines after production is ready
        env:
          SEARCH_BASE_REF: ${{ github.event.before }}
          SEARCH_HEAD_REF: ${{ github.sha }}
          PRODUCTION_URL: https://www.kehong.tech
          PRODUCTION_DEPLOYMENT: ${{ vars.PRODUCTION_DEPLOYMENT_ID }}
          BAIDU_SITE_URL: ${{ secrets.BAIDU_SITE_URL }}
          BAIDU_PUSH_TOKEN: ${{ secrets.BAIDU_PUSH_TOKEN }}
        run: pnpm release:search-notify
      - name: Upload submission audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: search-submission-runs-${{ github.sha }}
          path: reports/search-submission-runs/
          if-no-files-found: ignore
